{% extends 'base.html' %}
{% load static %}

{% block title %}Available Quizzes{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h2>Available Quizzes</h2>
        <ul>
            {% for quiz in quizzes %}
                <li>
                    <h3>{{ quiz.title }}</h3>
                    <p>{{ quiz.description }}</p>
                    <a href="{% url 'attempt_quiz' quiz.id %}" class="btn btn-primary">Attempt Quiz</a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
